[project]
name = "academic-decoder"
version = "1.0.0"
description = "Summaries and practice questions from your own study notes, using classic NLP."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
